<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
<title id="title">WorkManager 工作总览与今日工作 UI 原型</title>
<desc id="desc">经用户确认的简洁 Apple 风格 Windows 桌面工作管理界面，左侧为工作总览，右侧为今日工作。</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset="1" stop-color="#e7edf9"/></linearGradient>
  <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#eaf1ff"/></linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fbfcff"/></linearGradient>
  <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="13"/></filter>
  <style>
    .ui{font-family:"Segoe UI","Microsoft YaHei","DengXian",sans-serif;fill:#20242d}
    .muted{fill:#737d8e}
    .blue{fill:#1674f5}
    .green{fill:#28a745}
    .orange{fill:#c77717}
    .title{font-size:31px;font-weight:700}
    .section{font-size:20px;font-weight:650}
    .task{font-size:17px;font-weight:600}
    .small{font-size:14px}
    .tiny{font-size:12px}
  </style>
</defs>
<rect width="1672" height="941" fill="url(#canvas)"/>
<rect x="15" y="94" width="802" height="758" rx="20" fill="#8d9ab1" opacity=".16" filter="url(#windowShadow)"/>
<rect x="832" y="94" width="804" height="758" rx="20" fill="#8d9ab1" opacity=".16" filter="url(#windowShadow)"/>

